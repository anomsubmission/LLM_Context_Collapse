[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cliff-repro"
version = "1.0.0"
description = "Reproduce 'Localizing and repairing the in-context cliff: a CLS account of fast and slow learning in LLMs'"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Mohammad Rostami"}]

# Tier 0/1 (verify + figures) needs only these. No torch, no network.
dependencies = ["matplotlib>=3.7", "numpy>=1.24"]

[project.optional-dependencies]
# Tier 2: re-run the experiments.
experiments = [
  "torch>=2.1", "transformers>=4.44", "peft>=0.11",
  "accelerate>=0.30", "datasets>=2.18",
]
quant = ["bitsandbytes>=0.43"]      # only for --load-in-4bit
dev = ["pytest>=7.4"]
all = ["cliff-repro[experiments,quant,dev]"]

[project.scripts]
cliff = "cliff.cli:main"

[tool.setuptools]
packages = ["cliff", "cliff.backends", "cliff.experiments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
